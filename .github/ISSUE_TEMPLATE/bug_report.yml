name: Bug report
description: Report reproducible DrawArch behavior
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What happened and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction, description: Include tool name, sanitized input, transport, Node version, and logs. }
    validations: { required: true }
  - type: textarea
    id: verification
    attributes: { label: Generated artifact validation, description: Include validation output but do not attach confidential reference images. }
